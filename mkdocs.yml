site_name: Kopia for Mere Mortals
site_description: A backup program that encrypts and deduplicates your files before they leave the machine. Making a repository, taking snapshots, setting retention policies, restoring single files or whole trees, and checking for yourself that the stored copy cannot be read without the password.
site_url: https://paulsullivan33-dev.github.io/kopia-for-mere-mortals/
